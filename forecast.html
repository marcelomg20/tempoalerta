<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SRC/STYLES/styles.css?v=10">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <title>Próximos dias</title>
    <style>
        #container2 { max-width: 550px !important; margin: 20px auto !important; padding: 15px !important; }
        #forecast { display: flex !important; flex-direction: column !important; gap: 16px !important; background: transparent !important; }
        .dia-bloco { background: white !important; border-radius: 16px !important; padding: 14px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important; }
        .dia-titulo { font-weight: 800 !important; color: #0a2a5e !important; text-transform: uppercase !important; margin-bottom: 10px !important; font-size: 14px !important; }
        .horarios-linha { display: flex !important; flex-direction: row !important; gap: 8px !important; justify-content: space-between !important; }
        .horario-item { flex: 1 !important; background: #ffffff !important; border: 1px solid #cbd5e1 !important; box-shadow: 0 2px 6px rgba(0,0,0,0.08) !important; border-radius: 12px !important; padding: 10px 4px !important; text-align: center !important; color: #111 !important; }
        .horario-item img { width: 38px !important; }
        .btn-voltar { display: block !important; text-align: center !important; background: #0a2a5e !important; color: white !important; padding: 12px !important; border-radius: 12px !important; text-decoration: none !important; margin-bottom: 15px !important; font-weight: bold !important; }
    </style>
</head>
<body style="background: #87CEEB;">
    <div id="container2">
        <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        <div id="forecast"></div>
    </div>
    <script src="SRC/JAVASCRIPT/forecast.js?v=10"></script>
</body>
</html>
