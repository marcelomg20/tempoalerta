<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SRC/STYLES/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="image/png" href="SRC/images/bandeirars.png">
    <title>Próximos dias</title>
    <style>
        body {
            background: url('SRC/images/fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        #container2 {
            max-width: 500px;
            margin: 20px auto;
            padding: 15px;
        }
        #forecast {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        /* Cada dia */
        .dia-bloco {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .dia-titulo {
            font-weight: 800;
            color: #0a2a5e;
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-left: 5px;
            font-size: 14px;
        }
        /* Os 3 horários lado a lado */
        .horarios-linha {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .horario-item {
            flex: 1;
            background: #eef4ff;
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            font-size: 13px;
            color: #1a1a1a;
        }
        .horario-item img {
            width: 38px;
            height: 38px;
        }
        .btn-voltar {
            display: block;
            text-align: center;
            background: #0a2a5e;
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container2">
        <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        <div id="forecast">
            <!-- A previsão de 5 dias será preenchida aqui -->
        </div>
    </div>

    <script src="SRC/JAVASCRIPT/forecast.js"></script>
</body>
</html>
