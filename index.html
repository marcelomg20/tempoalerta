<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SRC/STYLES/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="icon" type="image/png" href="SRC/images/bandeirars.png">
    <link rel="icon" type="image/png" href="https://marcelomg20.github.io/tempoalerta/my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://marcelomg20.github.io/tempoalerta/my-favicon/favicon.svg" />
    <link rel="shortcut icon" href="https://marcelomg20.github.io/tempoalerta/my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://marcelomg20.github.io/tempoalerta/my-favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="#FORÇARS" />
    <link rel="manifest" href="https://marcelomg20.github.io/tempoalerta/my-favicon/site.webmanifest" />
    <title>#FORÇARS</title>
</head>
<body>
    <div id="alert"></div>
    <div id="container">
        
        <form id="search">
            <i class="fa-solid fa-location-dot"></i>
            <input type="search" name="city_name" id="city_name" placeholder="Digite outra cidade">
            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>

        <div id="weather">
            <h1 id="title">Porto Alegre, BR</h1>
            <div id="forecast-container">
                <div id="temp">
                    <div id="left">
                        <img id="temp_img" src="https://openweathermap.org/img/wn/02d@2x.png" alt="">
                        <p id="temp_description">algumas nuvens</p>
                    </div>
                    <div id="right">
                        <p id="temp_value">23,8 <sup>°C</sup></p>
                        <div id="additional-info">
                            <p><i class="fa-solid fa-droplet"></i> <span id="humidity">60%</span></p>
                            <p><i class="fa-solid fa-wind"></i> <span id="wind">22.2 km/h</span></p>
                        </div>
                    </div>
                </div>             
            </div>
        </div>

        <!-- NOVO BOX DE SATÉLITE -->
        <div id="satellite-box">
            <h3><i class="fa-solid fa-satellite"></i> Satélite - Rio Grande do Sul</h3>
            <div id="satellite-frame">
                <img id="sat_img" src="https://satelite.inmet.gov.br/images/goes16/realcada/amsul_real.png" alt="Imagem de satélite RS">
            </div>
            <p class="satellite-legenda">GOES-16 / INMET - Atualiza a cada 10 min</p>
        </div>

        <!-- Botões de navegação -->
        <a href="forecast.html" class="forecast-link"><i class="fa-solid fa-calendar-alt"></i> Próximos dias</a>
        <a href="https://nivelguaiba.com.br/" class="inpe-link" target="_blank"><i class="fa-solid fa-water"></i> Nível do Guaíba</a>
        <a href="https://avisos.inmet.gov.br" class="alert-link" target="_blank"><i class="fa-solid fa-triangle-exclamation"></i> Alertas do INMET</a>
        
    </div>

    <script src="SRC/JAVASCRIPT/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Força atualização da imagem de satélite
        function atualizarSatelite() {
            const img = document.getElementById('sat_img');
            if(img) {
                const t = new Date().getTime();
                img.src = "https://satelite.inmet.gov.br/images/goes16/realcada/amsul_real.png?t=" + t;
            }
        }
        setInterval(atualizarSatelite, 600000);
    </script>
</body>
</html>
