<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SRC/STYLES/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <title>#FORÇARS</title>
</head>
<body>
    <div id="alert"></div>
    <div id="container">
        <form id="search">
            <i class="fa-solid fa-location-dot"></i>
            <input type="search" name="city_name" id="city_name" placeholder="Digite outra cidade">
            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>

        <div id="weather">
            <h1 id="title"></h1>
            <div id="forecast-container">
                <div id="temp">
                    <div id="left">
                        <img id="temp_img" src="" alt="">
                        <p id="temp_description"></p>
                    </div>
                    <div id="right">
                        <p id="temp_value"><sup>°C</sup></p>
                        <div id="additional-info">
                            <p><i class="fa-solid fa-droplet"></i> <span id="humidity"></span></p>
                            <p><i class="fa-solid fa-wind"></i> <span id="wind"></span></p>
                        </div>
                    </div>
                </div>             
            </div>
        </div>

        <div id="satellite-box">
            <h3><i class="fa-solid fa-satellite"></i> Satélite - Rio Grande do Sul</h3>
            <div id="satellite-frame"></div>
            <p class="satellite-legenda">Satélite ao vivo - azul/verde = chuva</p>
        </div>

        <a href="forecast.html" class="forecast-link"><i class="fa-solid fa-calendar-alt"></i> Próximos dias</a>
        <a href="https://nivelguaiba.com.br/" class="inpe-link" target="_blank"><i class="fa-solid fa-water"></i> Nível do Guaíba</a>
        <a href="https://avisos.inmet.gov.br" class="alert-link" target="_blank"><i class="fa-solid fa-exclamation-triangle"></i> Alertas do INMET</a>
    </div>

    <script src="SRC/JAVASCRIPT/script.js?v=4"></script>
    <script>
        const map = L.map('satellite-frame', {zoomControl:false, attributionControl:false}).setView([-30.0, -52.5], 6);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19}).addTo(map);

        // Chuva ao vivo - seguro, não quebra se falhar
        fetch('https://api.rainviewer.com/public/weather-maps.json')
        .then(r => r.json())
        .then(data => {
            try {
                if (data.radar && data.radar.past && data.radar.past.length > 0) {
                    const radarPath = data.radar.past[data.radar.past.length - 1].path;
                    L.tileLayer(data.host + radarPath + '/256/{z}/{x}/{y}/2/1_1.png', {opacity: 0.85}).addTo(map);
                }
            } catch(e){ console.log('Radar off', e); }
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {maxZoom: 19}).addTo(map);
    </script>
</body>
</html>
