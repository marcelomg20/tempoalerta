<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SRC/STYLES/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="icon" type="image/png" href="SRC/images/bandeirars.png">
    <link rel="icon" type="image/png" href="https://marcelomg20.github.io/tempoalerta/my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://marcelomg20.github.io/tempoalerta/my-favicon/favicon.svg" />
    <link rel="shortcut icon" href="https://marcelomg20.github.io/tempoalerta/my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://marcelomg20.github.io/tempoalerta/my-favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="#FORÇARS" />
    <link rel="manifest" href="https://marcelomg20.github.io/tempoalerta/my-favicon/site.webmanifest" />
    <title>#FORÇARS</title>
</head>
<body>
    <div id="alert"></div>
    <div id="container">
        
        <form id="search">
            <i class="fa-solid fa-location-dot"></i>
            <input type="search" name="city_name" id="city_name" placeholder="Digite outra cidade">
            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>

        <div id="weather">
            <h1 id="title"></h1>
            <div id="forecast-container">
                <div id="temp">
                    <div id="left">
                        <img id="temp_img" src="" alt="">
                        <p id="temp_description"></p>
                    </div>
                    <div id="right">
                        <p id="temp_value"><sup>°C</sup></p>
                        <div id="additional-info">
                            <p><i class="fa-solid fa-droplet"></i> <span id="humidity"></span></p>
                            <p><i class="fa-solid fa-wind"></i> <span id="wind"></span></p>
                        </div>
                    </div>
                </div>             
            </div>
        </div>

        <!-- BOX SATÉLITE COM NUVENS + CHUVA + CIDADES -->
        <div id="satellite-box">
            <h3><i class="fa-solid fa-satellite"></i> Satélite - Rio Grande do Sul</h3>
            <div id="satellite-frame"></div>
            <p class="satellite-legenda">Branco = nuvens | Colorido = chuva</p>
        </div>

        <a href="forecast.html" class="forecast-link"><i class="fa-solid fa-calendar-alt"></i> Próximos dias</a>
        <a href="https://nivelguaiba.com.br/" class="inpe-link" target="_blank"><i class="fa-solid fa-water"></i> Nível do Guaíba</a>
        <a href="https://avisos.inmet.gov.br" class="alert-link" target="_blank"><i class="fa-solid fa-exclamation-triangle"></i> Alertas do INMET</a>
    </div>

    <script src="SRC/JAVASCRIPT/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const OW_KEY = "3afeb284954c8955c926203ff7f0cc99";
        const map = L.map('satellite-frame', {
            zoomControl: false,
            attributionControl: false
        }).setView([-30.0, -52.5], 6);

        // 1. Fundo satélite real
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        // 2. Todas as nuvens
        L.tileLayer(`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${OW_KEY}`, {
            opacity: 0.6,
            maxZoom: 19
        }).addTo(map);

        // 3. Só nuvem de CHUVA (aparece colorido quando está chovendo)
        L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${OW_KEY}`, {
            opacity: 0.7,
            maxZoom: 19
        }).addTo(map);

        // 4. Nomes das cidades e fronteiras por cima
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);
    </script>
</body>
</html>
